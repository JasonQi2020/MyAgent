# agent-demo settings (no secrets here: those go in .env). Restart the agent after a change.

# ---- Mail -------------------------------------------------------------------
# Which mailbox the agent uses: sina | gmail
mail.provider=sina

# Sina Mail (IMAP/SMTP). The authorization code goes in .env as SINA_AUTH_CODE.
mail.sina.address=jasonqi8@sina.com
mail.sina.imap_host=imap.sina.com
mail.sina.imap_port=993
mail.sina.smtp_host=smtp.sina.com
mail.sina.smtp_port=465

# Gmail (OAuth files in ~/.gmail-mcp/). The address is optional; it tells the agent who "me" is.
mail.gmail.address=

# ---- Models (/strongmodel, /weakmodel, /model in any chat; no restart needed) ---
# Profile a new conversation starts with: weak | strong
model.default=weak
# weak: the model from .env (LLM_PROVIDER / LLM_MODEL), unless set here, e.g.
#   model.weak.provider=qwen
#   model.weak.name=qwen-plus
# strong: ChatGPT. Key: OPENAI_API_KEY in .env. Edits here apply at the next /strongmodel.
model.strong.provider=openai
model.strong.name=gpt-5.5

# ---- Claude Code (/claude <request>, /claude on|off; re-read on every message) ---
claude.enabled=true
# Folders Claude Code may work in (comma-separated; absolute paths: "~" is the home of the user running the server).
# The first is the default working folder. Empty = the folder that contains agent-demo.
claude.folders=/home/myall/myHermes/agent-demo/data
# Run Claude Code in a bwrap sandbox: only claude.folders (read-write) and system folders (read-only)
# are visible; your code, .env and home folders do not exist for it. on (default) | off.
# With "on", /claude refuses to run if bwrap is missing (it never falls back to running unsandboxed).
claude.sandbox=on
claude.max_turns=40
# Approvals for Claude Code's shell commands and web access:
#   auto = run without asking, except dangerous ones (sudo, rm -r/-f, git push, git reset --hard, curl|sh, ...)
#   ask  = only read-only commands (ls, cat, git diff, ...) run without asking
#   full = never ask
# File edits are always limited to claude.folders. Shell commands are not, in auto and full.
claude.approval=auto
claude.timeout_minutes=20
# Per message; only applies when signed in with ANTHROPIC_API_KEY
claude.max_budget_usd=2
# Claude Code's model (empty = its default). Not affected by /strongmodel or /weakmodel.
claude.model=
# The owner: /claude works only in this Feishu direct chat (and in the CLI and local web UI)
claude.owner.feishu=ou_2464ce99fb6886831cd01144de172c3c
# The owner in Telegram (user id): /claude and scheduled tasks in that direct chat
claude.owner.telegram=8070391224
# The owner in WeCom (userid): /claude and scheduled tasks in that direct chat
claude.owner.wecom=blackwingstechcooperation

# ---- Scheduled tasks ("query FTNT every day and report to me at 9 PM"; owner only) -----
tasks.enabled=true
# Time zone for task times unless a task names its own
tasks.timezone=America/Los_Angeles
tasks.max_tasks=20
# No task may run more often than this
tasks.min_interval_minutes=15
# A run missed while the server was off is caught up once if it is less than this late
tasks.catch_up_minutes=60
